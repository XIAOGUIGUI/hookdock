name: HookDock Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: npm ci
      - run: npm run version:check
      - run: npm run typecheck
      - run: npm run npm:test
      - run: cargo fmt --all --check
      - run: npm run bridge:build
      - run: cargo test --workspace --locked
      - run: npm run app:build
      - name: Stage installer and npm package
        run: node scripts/stage-release.mjs
      - name: Test packed npm CLI
        run: node scripts/test-packed-npm.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: HookDock-Windows-x64
          path: release/*
          if-no-files-found: error
          retention-days: 14
