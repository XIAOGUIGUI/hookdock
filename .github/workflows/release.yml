name: HookDock Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: npm ci
      - run: npm run version:check
      - run: npm run typecheck
      - run: npm run npm:test
      - run: cargo fmt --all --check
      - run: npm run bridge:build
      - run: cargo test --workspace --locked
      - run: npm run app:build
      - name: Bundle latest HookDock Terminal for offline npm installs
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $terminalRepository = "XIAOGUIGUI/hookdock-terminal"
          $tag = gh release view --repo $terminalRepository --json tagName --jq '.tagName'
          if ($LASTEXITCODE -ne 0 -or $tag -notmatch '^hookdock-v(\d+\.\d+\.\d+\.\d+)$') {
            throw "No valid HookDock Terminal release is available"
          }
          $version = $Matches[1]
          $directory = New-Item -ItemType Directory -Force terminal-release
          gh release download $tag `
            --repo $terminalRepository `
            --pattern 'HookDockTerminal_*_x64_unsigned.msix' `
            --dir $directory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $assets = @(Get-ChildItem $directory -File -Filter '*.msix')
          if ($assets.Count -ne 1) {
            throw "Expected exactly one unsigned HookDock Terminal MSIX"
          }
          "HOOKDOCK_TERMINAL_ASSET=$($assets[0].FullName)" >> $env:GITHUB_ENV
          "HOOKDOCK_TERMINAL_VERSION=$version" >> $env:GITHUB_ENV
      - name: Stage release assets
        run: node scripts/stage-release.mjs
      - name: Test packed npm CLI
        run: node scripts/test-packed-npm.mjs
      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: HookDock-release-candidate
          path: release/*
          if-no-files-found: error
          retention-days: 14
      - name: Check npm version availability
        id: npm_version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/check-npm-version.mjs
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem release -File | ForEach-Object { $_.FullName })
          if ($assets.Count -lt 4) { throw "Expected installer, npm tarball, checksums, and manifest" }
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $assets --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $assets --repo $env:GITHUB_REPOSITORY --generate-notes --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish npm downloader
        if: startsWith(github.ref, 'refs/tags/v') && steps.npm_version.outputs.published != 'true'
        shell: pwsh
        run: |
          $tarball = Get-ChildItem release/*.tgz | Select-Object -First 1
          if (-not $tarball) { throw "npm tarball was not produced" }
          npm publish $tarball.FullName --access public --provenance
