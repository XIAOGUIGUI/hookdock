name: HookDock Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: npm ci
      - run: npm run version:check
      - run: npm run typecheck
      - run: npm run npm:test
      - run: cargo fmt --all --check
      - run: npm run bridge:build
      - run: cargo test --workspace --locked
      - run: npm run app:build
      - name: Stage release assets
        run: node scripts/stage-release.mjs
      - name: Test packed npm CLI
        run: node scripts/test-packed-npm.mjs
      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: HookDock-release-candidate
          path: release/*
          if-no-files-found: error
          retention-days: 14
      - name: Check npm version availability
        id: npm_version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $manifest = Get-Content release/manifest.json -Raw | ConvertFrom-Json
          $package = "$($manifest.npmPackage)@$($manifest.version)"
          $publishedVersion = npm view $package version --json 2>$null
          if ($LASTEXITCODE -eq 0) {
            "published=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "$package is already published; npm publish will be skipped."
            exit 0
          }
          $lookupError = $publishedVersion | ConvertFrom-Json
          if ($lookupError.error.code -ne "E404") {
            throw "Could not check npm version availability: $publishedVersion"
          }
          "published=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem release -File | ForEach-Object { $_.FullName })
          if ($assets.Count -lt 4) { throw "Expected installer, npm tarball, checksums, and manifest" }
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $assets --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $assets --repo $env:GITHUB_REPOSITORY --generate-notes --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish npm downloader
        if: startsWith(github.ref, 'refs/tags/v') && steps.npm_version.outputs.published != 'true'
        shell: pwsh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          $tarball = Get-ChildItem release/*.tgz | Select-Object -First 1
          if (-not $tarball) { throw "npm tarball was not produced" }
          npm publish $tarball.FullName --access public --provenance
