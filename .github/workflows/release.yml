name: HookDock Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run version:check
      - run: npm run typecheck
      - run: npm run npm:test
      - run: cargo fmt --all --check
      - run: cargo test --workspace
      - run: npm run dist:win
      - name: Prepare signed-by-checksum release assets
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item $installer.FullName release/HookDock-Setup-x64.exe
          $hash = (Get-FileHash release/HookDock-Setup-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  HookDock-Setup-x64.exe" | Set-Content -Encoding ascii release/checksums.txt
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME release/HookDock-Setup-x64.exe release/checksums.txt --repo $env:GITHUB_REPOSITORY --generate-notes --verify-tag
      - name: Publish npm downloader
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
